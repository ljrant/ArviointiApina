<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Arviointiapina</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="sidepanel.css" />
  </head>

  <body>
    <div class="app">
      <div class="app-header">
        <h1>Arviointiapina</h1>
        <div id="site-badge">—</div>
      </div>

      <div class="card">
        <h2>Current page</h2>
        <div id="current-page">Loading...</div>
      </div>

      <div class="card">
        <h2>Available tools</h2>
        <div id="tools-list" class="tool-list">Loading...</div>
      </div>

      <div class="card">
        <h2>Actions</h2>

        <!-- CSV import -->
        <input id="csv-file" type="file" accept=".csv,text/csv" />

        <button id="btn-upload-csv">
          Import CSV (grades + notes)
        </button>

        <button id="btn-refresh">
          Refresh page info
        </button>
      </div>

      <div class="card">
        <h2>Log</h2>
        <pre id="log"></pre>
      </div>
    </div>

    <script src="sidepanel.js"></script>
  </body>
</html>
